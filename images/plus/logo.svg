<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Le Git Graph Plus">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24292f"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- base line -->
  <path d="M40 22 V106" stroke="#3fb950" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- a branch that forks off and merges back -->
  <path d="M40 92 C40 78 70 80 70 64 V50 C70 36 40 38 40 28" stroke="#58a6ff" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="40" cy="28" r="9" fill="#0d1117" stroke="#3fb950" stroke-width="6"/>
  <circle cx="70" cy="57" r="8" fill="#58a6ff"/>
  <circle cx="40" cy="64" r="8" fill="#3fb950"/>
  <circle cx="40" cy="98" r="8" fill="#3fb950"/>
  <!-- plus badge -->
  <circle cx="94" cy="94" r="21" fill="#f78166"/>
  <path d="M94 83 V105 M83 94 H105" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
</svg>
